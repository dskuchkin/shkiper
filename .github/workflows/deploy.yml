name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/practical-goldberg-ty9y2i
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel in-progress production deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Try to auto-enable Pages with the "GitHub Actions" source.
          # If repo policy blocks this, enable it once in Settings → Pages.
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repository root (static HTML/CSS/JS site)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
